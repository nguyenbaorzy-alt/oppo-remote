name: Build OPPO Remote Control APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" để tạo file APK bất kỳ lúc nào

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Cấp quyền thực thi cho gradlew
      run: chmod +x ./android-client/gradlew

    - name: Thiết lập Keystore đồng nhất
      run: |
        if [ ! -f android-client/app/debug.keystore ]; then
          keytool -genkey -v -keystore android-client/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=OPPO Remote,O=RemoteControl,C=VN"
        fi

    - name: Biên dịch file APK (Debug)
      run: |
        cd android-client
        ./gradlew assembleDebug

    - name: Xuất file APK để tải về
      uses: actions/upload-artifact@v4
      with:
        name: OPPO-Remote-Control-APK
        path: android-client/app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Tạo GitHub Release v1.0.5 và đính kèm APK
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.5
        name: "OPPO Remote Control v1.0.5 (Fix Đa nhiệm & Đen màn)"
        body: |
          🚀 Bản cập nhật v1.0.5:
          - Khắc phục triệt để lỗi bấm tab Đa nhiệm (Recents) bị đen màn hình và ngắt kết nối.
          - Bắt buộc cấu hình Entire Screen Capture (chuẩn Android 14+).
          - Tối ưu kích thước khung hình stream, giảm tải 80% RAM & CPU trên Meizu 21 Pro / OPPO ColorOS.
          - Nâng thời gian timeout Cloud lên 30 giây chống rớt mạng.
        files: android-client/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
